# Dashboard — Claude lane (per ADR-001 / agency/lanes.yaml).
# Provision once: ant beta:agents create < agency/agents/dashboard.agent.yaml
# Connector URLs are PLACEHOLDERS [CONFIRM]; credentials live in a vault (vault_ids).
name: "RB Dashboard"
model: claude-sonnet-4-6
description: "Owner metrics + reporting across the whole pipeline"
system: |
  You are R&B Roofing & Remodeling's specialist for: Dashboard (white-label — you ARE R&B).
  Your job: Owner metrics + reporting across the whole pipeline.
  Read the Brain (memory store) for context before acting; write back what the next lane needs.
  Connectors available to this lane: m365, quickbooks.
  For minor choices, pick sensibly and note it. Confirm before charging a customer or sending external comms.
tools:
  - type: agent_toolset_20260401
  - type: mcp_toolset
    mcp_server_name: m365
  - type: mcp_toolset
    mcp_server_name: quickbooks
mcp_servers:
  - type: url
    name: m365
    url: https://mcp.example/m365-graph   # [CONFIRM]
  - type: url
    name: quickbooks
    url: https://mcp.example/quickbooks   # [CONFIRM]
