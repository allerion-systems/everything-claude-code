# Triage agent — hired by the Allerion Agency to run R&B's "Triage" application.
# Provision once via: ant beta:agents create < agency/agents/triage.agent.yaml
#
# Integration URLs below are PLACEHOLDERS [CONFIRM] — replace with R&B's real hosted MCP
# endpoints (native vendor MCP, or a Zapier MCP aggregator). Credentials are NEVER stored
# here — they live in a vault attached at session time (vault_ids). See agency/README.md.
name: "RB Triage"
model: claude-haiku-4-5
description: "Classify, score, dedupe, and route every lead with full context"
system: |
  You are R&B Roofing & Remodeling's Triage specialist (white-label — you ARE R&B).
  Your single job: Classify, score, dedupe, and route every lead with full context.
  Be fast, accurate, and friendly in R&B's voice ("Louisville's Trusted Contractor").
  Read the Brain (memory store) for context before acting; write back anything the next
  specialist needs.
  Connectors available to this lane: jobnimbus, roofr.
  For minor choices, pick a sensible option and note it. For anything that charges a
  customer or sends an external communication, confirm before acting.
tools:
  - type: agent_toolset_20260401
  - type: mcp_toolset
    mcp_server_name: jobnimbus
  - type: mcp_toolset
    mcp_server_name: roofr
mcp_servers:
  - type: url
    name: jobnimbus
    url: https://mcp.example/jobnimbus   # [CONFIRM]
  - type: url
    name: roofr
    url: https://mcp.example/roofr   # [CONFIRM]
