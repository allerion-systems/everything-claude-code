<text x="816" y="48" font-size="16" font-family="Arial" font-weight="bold" text-anchor="middle">SHEET 5 — GENERAL NOTES &amp; MATERIAL SCHEDULE</text><text x="30" y="75" font-size="10" font-family="Arial" font-weight="bold">GENERAL NOTES — IRC 2021 / LOUISVILLE METRO AMENDMENTS</text><text x="30" y="90" font-size="8.5" font-family="Arial">1. ALL WORK SHALL COMPLY WITH IRC 2021 AND LOUISVILLE METRO CODE. CONTRACTOR SHALL OBTAIN ALL REQUIRED PERMITS AND INSPECTIONS.</text><text x="30" y="103" font-size="8.5" font-family="Arial">2. ALL LUMBER IN CONTACT WITH CONCRETE/EARTH: #2 PT SYP .40 RETENTION, INCISED.</text><text x="30" y="116" font-size="8.5" font-family="Arial">3. ALL STRUCTURAL LUMBER: #2 PT SYP UNLESS NOTED. IDENTIFY GRADE STAMPS AT INSPECTION.</text><text x="30" y="129" font-size="8.5" font-family="Arial">4. FROST DEPTH: 24" MINIMUM. ALL FOOTINGS BELOW FROST LINE. (LOUISVILLE/JEFFERSON CO. KY)</text><text x="30" y="142" font-size="8.5" font-family="Arial">5. CONCRETE: 3000 PSI @ 28 DAYS, TUBE FORMS. (3) #4 REBAR EACH FOOTING.</text><text x="30" y="155" font-size="8.5" font-family="Arial">6. LEDGER: 2x8 PT SYP. ATTACH WITH 1/2"x3" LAG SCREWS @ 16" OC STAGGERED 2 ROWS. INSTALL LEDGER FLASHING BEFORE LEDGER.</text><text x="30" y="168" font-size="8.5" font-family="Arial">7. JOISTS: 2x8 PT SYP @ 16" OC. SIMPSON LUS28 JOIST HANGERS AT LEDGER AND BEAMS.</text><text x="30" y="181" font-size="8.5" font-family="Arial">8. DECK BOARDS: MOISTURESHIELD ELEVATE 1x6 ALPINE GRAY COMPOSITE. INSTALL PER MFGR. BORDER: 42 LF. FASCIA: VISION SMOKE GRAY.</text><text x="30" y="194" font-size="8.5" font-family="Arial">9. GUARDRAIL: 42" HEIGHT REQUIRED (DECK &gt;30" ABOVE GRADE — IRC R312). MS DISCOVERY 1-3/8" COCKTAIL RAIL. MAX 4" BALUSTER SPACING.</text><text x="30" y="207" font-size="8.5" font-family="Arial">10. STAIR: 4'-0" WIDE, 10 RISERS @ 7-13/16", 9 TREADS @ 10" COMPOSITE. 2x12 PT STRINGERS (2 EA.). MIN HEADROOM 6'-8".</text><text x="30" y="220" font-size="8.5" font-family="Arial">11. UNDER-DECK WATERPROOFING: SBS 2-PLY MODIFIED BITUMEN (300 SF / 3 SQ.). MIN SLOPE 1/4"/FT. ISO BOARD 2" RIGID INSULATION BELOW.</text><text x="30" y="233" font-size="8.5" font-family="Arial">12. LATTICE SKIRT: MOISTURESHIELD FREE STYLE CLASSIC DIAMOND CLAY, 80 SF. GALVANIZED ANIMAL MESH BARRIER BEHIND LATTICE.</text><text x="30" y="246" font-size="8.5" font-family="Arial">13. PERGOLA: 4x4x12 PT POSTS (5 EA.), SAME FOOTING SPEC AS DECK POSTS.</text><text x="30" y="259" font-size="8.5" font-family="Arial">14. FASTENERS: HOT-DIPPED GALVANIZED OR STAINLESS STEEL THROUGHOUT.</text><text x="30" y="272" font-size="8.5" font-family="Arial">15. ALL DIMENSIONS FIELD VERIFIED BEFORE FRAMING. NOTIFY ENGINEER OF DISCREPANCIES.</text><text x="30" y="285" font-size="8.5" font-family="Arial">16. ELECTRICAL NOT IN SCOPE OF THIS PERMIT. SEE ELECTRICAL PERMIT IF REQUIRED.</text><text x="30" y="298" font-size="8.5" font-family="Arial">17. CALL 811 (UNDERGROUND UTILITY LOCATE) BEFORE EXCAVATION. MIN 48 HRS PRIOR.</text><text x="30" y="311" font-size="8.5" font-family="Arial">18. SEISMIC DESIGN CATEGORY C, WIND 115 MPH (EXP. B), GROUND SNOW 15 PSF. PER IRC TABLE R301.2(1) — LOUISVILLE/JEFFERSON COUNTY KY.</text><text x="30" y="324" font-size="8.5" font-family="Arial">19. DEMO: REMOVE EXISTING DECK BOARDS AND MATERIALS PER LOCAL DISPOSAL REQUIREMENTS.</text><text x="30" y="337" font-size="8.5" font-family="Arial">20. OWNER / CONTRACTOR TO VERIFY ALL PRODUCT COLORS AND SELECTIONS PRIOR TO ORDER.</text><text x="30" y="370" font-size="11" font-family="Arial" font-weight="bold">MATERIAL SCHEDULE</text><rect x="30" y="386" width="660" height="372" fill="white" stroke="black" stroke-width="1.2"/><line x1="90" y1="386" x2="90" y2="758" stroke="black" stroke-width="0.8"/><line x1="230" y1="386" x2="230" y2="758" stroke="black" stroke-width="0.8"/><line x1="550" y1="386" x2="550" y2="758" stroke="black" stroke-width="0.8"/><line x1="630" y1="386" x2="630" y2="758" stroke="black" stroke-width="0.8"/><rect x="30" y="386" width="660" height="16" fill="#ccc"/><line x1="30" y1="386" x2="690" y2="386" stroke="black" stroke-width="0.6"/><text x="34" y="398" font-size="8" font-family="Arial" font-weight="bold">MARK</text><text x="94" y="398" font-size="8" font-family="Arial" font-weight="bold">DESCRIPTION</text><text x="234" y="398" font-size="8" font-family="Arial" font-weight="bold">SPEC / PRODUCT</text><text x="554" y="398" font-size="8" font-family="Arial" font-weight="bold">QTY</text><text x="634" y="398" font-size="8" font-family="Arial" font-weight="bold">UNIT</text><line x1="30" y1="402" x2="690" y2="402" stroke="black" stroke-width="0.6"/><text x="34" y="414" font-size="8" font-family="Arial">S-1</text><text x="94" y="414" font-size="8" font-family="Arial">DECK JOISTS</text><text x="234" y="414" font-size="8" font-family="Arial">2x8 PT SYP #2 @ 16" OC</text><text x="554" y="414" font-size="8" font-family="Arial">13</text><text x="634" y="414" font-size="8" font-family="Arial">EA</text><line x1="30" y1="418" x2="690" y2="418" stroke="black" stroke-width="0.6"/><text x="34" y="430" font-size="8" font-family="Arial">S-2</text><text x="94" y="430" font-size="8" font-family="Arial">LEDGER</text><text x="234" y="430" font-size="8" font-family="Arial">2x8 PT SYP</text><text x="554" y="430" font-size="8" font-family="Arial">17</text><text x="634" y="430" font-size="8" font-family="Arial">LF</text><line x1="30" y1="434" x2="690" y2="434" stroke="black" stroke-width="0.6"/><text x="34" y="446" font-size="8" font-family="Arial">S-3</text><text x="94" y="446" font-size="8" font-family="Arial">SIDE BEAMS</text><text x="234" y="446" font-size="8" font-family="Arial">2-2x8 PT SYP</text><text x="554" y="446" font-size="8" font-family="Arial">2×17</text><text x="634" y="446" font-size="8" font-family="Arial">LF</text><line x1="30" y1="450" x2="690" y2="450" stroke="black" stroke-width="0.6"/><text x="34" y="462" font-size="8" font-family="Arial">S-4</text><text x="