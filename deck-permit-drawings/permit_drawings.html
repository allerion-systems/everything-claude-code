<style>
  :root { --accent: #2563eb; --dark: #1e293b; --bg: #0f172a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); font-family: -apple-system, Arial, sans-serif; color: #e2e8f0; }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--dark); border-bottom: 1px solid #334155;
    padding: 0 20px;
    display: flex; align-items: center; gap: 16px;
    height: 56px; box-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .logo { font-size: 13px; font-weight: 700; color: #f1f5f9; white-space: nowrap; }
  .logo span { color: var(--accent); }
  nav { display: flex; gap: 6px; overflow-x: auto; flex: 1; }
  nav a {
    white-space: nowrap; padding: 6px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600; text-decoration: none;
    color: #94a3b8; border: 1px solid #334155;
    transition: all 0.15s;
  }
  nav a:hover { background: #1e40af; color: white; border-color: #1e40af; }
  .btn-print {
    margin-left: auto; padding: 7px 16px; border-radius: 6px;
    background: var(--accent); color: white; font-size: 12px;
    font-weight: 700; border: none; cursor: pointer; white-space: nowrap;
  }
  .btn-print:hover { background: #1d4ed8; }

  /* MAIN */
  main { padding: 24px 20px; max-width: 1400px; margin: 0 auto; }

  /* SHEET CARD */
  .sheet {
    margin-bottom: 32px; border-radius: 10px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    border: 1px solid #1e293b;
  }
  .sheet-header {
    background: var(--dark); padding: 10px 18px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 2px solid var(--accent);
  }
  .sheet-num {
    background: var(--accent); color: white;
    font-size: 11px; font-weight: 800; padding: 3px 8px;
    border-radius: 4px; letter-spacing: 0.5px;
  }
  .sheet-title { font-size: 13px; font-weight: 700; color: #f1f5f9; letter-spacing: 0.5px; }
  .sheet-body { background: white; }
  .sheet-body svg { display: block; width: 100%; height: auto; }

  /* ZOOM CONTROLS */
  .zoom-bar {
    background: #1e293b; padding: 6px 18px;
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid #334155;
  }
  .zoom-bar button {
    background: #334155; color: #e2e8f0; border: none;
    width: 28px; height: 28px; border-radius: 4px; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  .zoom-bar button:hover { background: var(--accent); }
  .zoom-label { font-size: 11px; color: #64748b; min-width: 40px; text-align: center; }
  .zoom-wrapper { overflow: auto; }
  .zoom-inner { transform-origin: top left; transition: transform 0.2s; }

  /* PRINT */
  @media print {
    header, .sheet-header, .zoom-bar { display: none !important; }
    body { background: white; }
    main { padding: 0; max-width: none; }
    .sheet { box-shadow: none; border: none; border-radius: 0; margin: 0; page-break-after: always; }
    .sheet-body { background: white; }
  }
</style>
</head>

<script>
function getZoomState(btn) {
  const wrapper = btn.closest('.sheet').querySelector('.zoom-inner');
  const label = btn.closest('.zoom-bar').querySelector('.zoom-label');
  return { wrapper, label };
}
function zoom(btn, dir) {
  const { wrapper, label } = getZoomState(btn);
  const cur = parseFloat(wrapper.dataset.zoom || 1);
  const next = Math.max(0.25, Math.min(4, cur + dir * 0.25));
  wrapper.dataset.zoom = next;
  wrapper.style.transform = `scale(${next})`;
  wrapper.parentElement.style.height = (wrapper.scrollHeight * next) + 'px';
  label.textContent = Math.round(next * 100) + '%';
}
function zoomReset(btn) {
  const { wrapper, label } = getZoomState(btn);
  wrapper.dataset.zoom = 1;
  wrapper.style.transform = 'scale(1)';
  wrapper.parentElement.style.height = '';
  label.textContent = '100%';
}
</script>
