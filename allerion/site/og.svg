<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0d"/>
      <stop offset="1" stop-color="#14141a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fa7"/>
      <stop offset="0.6" stop-color="#5fdfff"/>
      <stop offset="1" stop-color="#7df57d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(95,223,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- mark -->
  <g transform="translate(80 80)">
    <path d="M0 60 L30 0 L60 60 Z" fill="none" stroke="url(#grad)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M15 60 L30 30 L45 60" fill="none" stroke="#7df57d" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <text x="170" y="135" fill="#e8e8ec" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="36" font-weight="600" letter-spacing="3">ALLERION</text>

  <!-- headline -->
  <text x="80" y="290" fill="#e8e8ec" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="64" font-weight="600" letter-spacing="-1.4">Open 5D construction</text>
  <text x="80" y="370" fill="#e8e8ec" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="64" font-weight="600" letter-spacing="-1.4">estimating, built for</text>
  <text x="80" y="450" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="64" font-weight="600" letter-spacing="-1.4" fill="url(#grad)">AI agents.</text>

  <text x="80" y="520" fill="#888894" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="22">An open alternative to Bexel Manager. MCP-first. MIT-licensed.</text>

  <!-- pricing strip -->
  <g transform="translate(80 555)">
    <rect width="100" height="36" rx="6" fill="#14141a" stroke="#2a2a35"/>
    <text x="50" y="22" text-anchor="middle" fill="#888894" font-family="system-ui" font-size="11" letter-spacing="0.7">CESIUM</text>
  </g>
  <g transform="translate(195 555)">
    <rect width="160" height="36" rx="6" fill="#14141a" stroke="#2a2a35"/>
    <text x="80" y="22" text-anchor="middle" fill="#888894" font-family="system-ui" font-size="11" letter-spacing="0.7">OPENSTREETMAP</text>
  </g>
  <g transform="translate(370 555)">
    <rect width="100" height="36" rx="6" fill="#14141a" stroke="#2a2a35"/>
    <text x="50" y="22" text-anchor="middle" fill="#888894" font-family="system-ui" font-size="11" letter-spacing="0.7">IFC 2X3</text>
  </g>
  <g transform="translate(485 555)">
    <rect width="80" height="36" rx="6" fill="#14141a" stroke="#2a2a35"/>
    <text x="40" y="22" text-anchor="middle" fill="#888894" font-family="system-ui" font-size="11" letter-spacing="0.7">MCP</text>
  </g>

  <!-- right side: stylized totals card -->
  <g transform="translate(770 200)">
    <rect width="360" height="280" rx="14" fill="#14141a" stroke="#2a2a35"/>
    <text x="24" y="40" fill="#888894" font-family="system-ui" font-size="11" letter-spacing="0.8">5D ESTIMATE</text>
    <text x="24" y="78" fill="#e8e8ec" font-family="system-ui" font-size="14">350 5th Ave, New York</text>

    <rect x="24" y="100" width="148" height="60" rx="8" fill="#1c1c24" stroke="#2a2a35"/>
    <rect x="24" y="100" width="3" height="60" fill="#ff5fa7"/>
    <text x="40" y="124" fill="#888894" font-family="system-ui" font-size="10" letter-spacing="0.8">MATERIAL</text>
    <text x="40" y="148" fill="#ff5fa7" font-family="system-ui" font-size="22" font-weight="600">$1.42M</text>

    <rect x="188" y="100" width="148" height="60" rx="8" fill="#1c1c24" stroke="#2a2a35"/>
    <rect x="188" y="100" width="3" height="60" fill="#5fdfff"/>
    <text x="204" y="124" fill="#888894" font-family="system-ui" font-size="10" letter-spacing="0.8">LABOR</text>
    <text x="204" y="148" fill="#5fdfff" font-family="system-ui" font-size="22" font-weight="600">$1.91M</text>

    <rect x="24" y="172" width="148" height="60" rx="8" fill="#1c1c24" stroke="#2a2a35"/>
    <rect x="24" y="172" width="3" height="60" fill="#ffcc5f"/>
    <text x="40" y="196" fill="#888894" font-family="system-ui" font-size="10" letter-spacing="0.8">EQUIPMENT</text>
    <text x="40" y="220" fill="#ffcc5f" font-family="system-ui" font-size="22" font-weight="600">$0.18M</text>

    <rect x="188" y="172" width="148" height="60" rx="8" fill="#1c1c24" stroke="#7df57d"/>
    <rect x="188" y="172" width="3" height="60" fill="#7df57d"/>
    <text x="204" y="196" fill="#888894" font-family="system-ui" font-size="10" letter-spacing="0.8">TOTAL</text>
    <text x="204" y="220" fill="#7df57d" font-family="system-ui" font-size="22" font-weight="600">$3.51M</text>
  </g>
</svg>
