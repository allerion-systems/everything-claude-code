name = "allerion-api"
main = "worker.js"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]

# api.allerion.io requires allerion.io to be an active zone in this Cloudflare
# account. It is currently on Squarespace nameservers, so this route will fail
# to deploy until the zone is moved — see README "Getting api.allerion.io to
# resolve". Until then, deploy without it and use the workers.dev hostname.
# [[routes]]
# pattern = "api.allerion.io"
# custom_domain = true

[vars]
RATE_LIMIT_PER_MINUTE = "20"
ALLOWED_ORIGINS = "https://warboard.allerion.io"
ANALYST_MODEL = "gpt-5.5"
EXTRACT_MODEL = "gpt-5.4-mini"

# Secrets are NOT set here — they would be committed. Set them with:
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put API_KEYS
[observability]
enabled = true
